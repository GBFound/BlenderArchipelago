name: Blenderer
game: Blender
description: Blender Archipelago
Blender:
  min_percent: 5    # Checks will generate at and above this percent. (Must be less than max_percent.)
  max_percent: 75   # Checks will generate at and below this percent. (Must be greater than min_percent.)
  goal_percent: 80  # The similarity percentage required to reach the goal.
  progressive_render_width_max: 2   # The number of Progressive Render Width items.
  progressive_render_height_max: 2  # The number of Progressive Render Height items.
  check_count: 35   # The number of checks that will be available.
  trap_count: 50    # Sets the percentage of filler items to be replaced by random traps.
  
  # When you undo/redo, everyone with deathlink dies.
  # When someone with deathlink dies, you will undo to the furthest undo in history.
  # Blender's default setting is 32 undos max in history.
  # Setting is in Edit -> Preferences -> System -> Memory & Limits -> Undo Steps
  death_link: True
